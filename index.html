<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Monster Strike Collect</title>

<!-- ── Favicon（瀏覽器分頁圖示）──────────────────── -->
<link rel="icon" type="image/png" href="./appicon.png">
<link rel="shortcut icon" href="./appicon.png">

<!-- ── iOS 加到主畫面圖示（三種尺寸）────────────── -->
<link rel="apple-touch-icon" sizes="120x120" href="./appicon.png">
<link rel="apple-touch-icon" sizes="152x152" href="./appicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="./appicon.png">

<!-- ── iOS 全螢幕 App 模式設定 ──────────────────── -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monster Strike Collect">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- ── Android Chrome PWA 設定 ──────────────────── -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#181c38">
<meta name="mobile-web-app-capable" content="yes">

<!-- ── Open Graph（分享連結預覽圖）─────────────── -->
<meta property="og:title" content="Monster Strike Collect">
<meta property="og:description" content="怪物彈珠角色收藏管理工具">
<meta property="og:image" content="./appicon.png">
<meta property="og:type" content="website">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="title-row">
    <span class="app-title">Monster Strike Collect</span>
    <span id="unsavedBadge">未備份</span>
  </div>
  <div class="accounts" id="accountTabs"></div>
</header>

<main>
  <div class="searchbar">
    <input class="search-input" type="text" id="searchBox" placeholder="🔍 搜尋角色名稱...">
    <button class="gbtn" onclick="openFilter()">▼ 篩選</button>
  </div>
  <div class="attr-row">
    <div class="attr-circle all active" data-attr="" onclick="setAttr(this)">全</div>
    <div class="attr-circle fire"  data-attr="火" onclick="setAttr(this)"></div>
    <div class="attr-circle water" data-attr="水" onclick="setAttr(this)"></div>
    <div class="attr-circle wood"  data-attr="木" onclick="setAttr(this)"></div>
    <div class="attr-circle light" data-attr="光" onclick="setAttr(this)"></div>
    <div class="attr-circle dark"  data-attr="暗" onclick="setAttr(this)"></div>
  </div>
  <div class="stats" id="statsArea"></div>
  <div class="sort-bar">
    <span class="sort-lbl">排序：</span>
    <div class="sort-btn active" onclick="setSort('no',this)">No.</div>
    <div class="sort-btn" onclick="setSort('name',this)">名稱</div>
    <div class="sort-btn" onclick="setSort('attr',this)">屬性</div>
    <div class="sort-dir-btn" id="sortDirBtn" onclick="toggleSortDir()">↑ 正序</div>
  </div>
  <div class="char-grid" id="charGrid"></div>
</main>

<nav class="bottom-nav">
  <div class="nav-item active"><span class="nav-icon">🏠</span><span class="nav-lbl">首頁</span></div>
  <div class="nav-item" onclick="openFilter()"><span class="nav-icon">🔍</span><span class="nav-lbl">篩選</span></div>
  <div class="nav-add" onclick="openAddModal()"><span class="nav-icon">＋</span><span class="nav-lbl">新增</span></div>
  <div class="nav-item" onclick="exportBackup()"><span class="nav-icon">⬇</span><span class="nav-lbl">備份</span></div>
  <div class="nav-item" onclick="document.getElementById('importFile').click()"><span class="nav-icon">⬆</span><span class="nav-lbl">匯入</span></div>
  <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importBackup(event)">
</nav>

<!-- 篩選抽屜 -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeFilter()"></div>
<div class="filter-drawer" id="filterDrawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title">篩選條件</div>

  <div class="drawer-section">
    <div class="drawer-lbl">技能（可多選）</div>
    <div class="sg3" id="fSkillGrid"></div>
  </div>
  <div class="drawer-section">
    <div class="drawer-lbl">殺手（可多選，點選展開）</div>
    <div class="cdd"><div class="cdd-hdr" onclick="toggleCdd(this)"><span class="cdd-lbl">全部</span><span class="cdd-arr">▼</span></div>
    <div class="cdd-body" id="fKillerBody"></div></div>
  </div>
  <div class="drawer-section">
    <div class="drawer-lbl">超反技能（可多選）</div>
    <div class="sg3" id="fSuperGrid"></div>
  </div>
  <div class="drawer-section">
    <div class="drawer-lbl">擊種</div>
    <div class="sg2" id="fStrikeGrid"></div>
  </div>
  <div class="drawer-section">
    <div class="drawer-lbl">英雄果實</div>
    <div class="sg2" id="fHeroFruitGrid"></div>
  </div>

  <div class="drawer-section filter-2col">
    <div>
      <div class="drawer-lbl">戰型</div>
      <div class="cdd"><div class="cdd-hdr" onclick="toggleCdd(this)"><span class="cdd-lbl">全部</span><span class="cdd-arr">▼</span></div>
      <div class="cdd-body sg4" id="fBattleBody"></div></div>
    </div>
    <div>
      <div class="drawer-lbl">稀有度</div>
      <div class="cdd"><div class="cdd-hdr" onclick="toggleCdd(this)"><span class="cdd-lbl">全部</span><span class="cdd-arr">▼</span></div>
      <div class="cdd-body sg2" id="fRarityBody"></div></div>
    </div>
  </div>

  <div class="drawer-section">
    <div class="drawer-lbl">種族（可多選）</div>
    <div class="cdd"><div class="cdd-hdr" onclick="toggleCdd(this)"><span class="cdd-lbl">全部</span><span class="cdd-arr">▼</span></div>
    <div class="cdd-body sg4" id="fRaceBody"></div></div>
  </div>

  <div class="drawer-section filter-2col">
    <div>
      <div class="drawer-lbl">主友情技</div>
      <div class="cdd"><div class="cdd-hdr" onclick="toggleCdd(this)"><span class="cdd-lbl">全部</span><span class="cdd-arr">▼</span></div>
      <div class="cdd-body" id="fFriendMainBody">
        <input type="text" class="minput cdd-search" placeholder="🔍 搜尋..." oninput="filterCddSearch(this)">
        <div class="sg3" id="fFriendMainGrid"></div>
      </div></div>
    </div>
    <div>
      <div class="drawer-lbl">副友情技（可多選）</div>
      <div class="cdd"><div class="cdd-hdr" onclick="toggleCdd(this)"><span class="cdd-lbl">全部</span><span class="cdd-arr">▼</span></div>
      <div class="cdd-body" id="fFriendSubBody">
        <input type="text" class="minput cdd-search" placeholder="🔍 搜尋..." oninput="filterCddSearch(this)">
        <div class="sg3" id="fFriendSubGrid"></div>
      </div></div>
    </div>
  </div>

  <div class="drawer-section filter-2col">
    <div>
      <div class="drawer-lbl">進化狀態</div>
      <div class="cdd"><div class="cdd-hdr" onclick="toggleCdd(this)"><span class="cdd-lbl">全部</span><span class="cdd-arr">▼</span></div>
      <div class="cdd-body sg2" id="fEvoBody"></div></div>
    </div>
    <div>
      <div class="drawer-lbl">入手方式</div>
      <div class="cdd"><div class="cdd-hdr" onclick="toggleCdd(this)"><span class="cdd-lbl">全部</span><span class="cdd-arr">▼</span></div>
      <div class="cdd-body sg3" id="fObtainBody"></div></div>
    </div>
  </div>

  <div class="drawer-section">
    <div class="drawer-lbl">合作活動</div>
    <div class="cdd"><div class="cdd-hdr" onclick="toggleCdd(this)"><span class="cdd-lbl">全部</span><span class="cdd-arr">▼</span></div>
    <div class="cdd-body" id="fCollabBody"></div></div>
  </div>

  <div class="drawer-section">
    <div class="drawer-lbl">擁有狀態</div>
    <div class="sg2" id="fOwnedGrid"></div>
  </div>

  <div class="drawer-actions">
    <button class="drawer-reset" onclick="resetFilter()">重置</button>
    <button class="drawer-confirm" onclick="closeFilter()">決定</button>
  </div>
</div>

<!-- 新增/編輯角色 Modal -->
<div class="modal-overlay" id="addCharModal">
  <div class="modal-box">
    <h2 id="modalTitle">新增角色</h2>

    <div class="mfield">
      <label>角色圖片</label>
      <div class="img-upload-area" onclick="document.getElementById('imgInput').click()">
        <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="handleImgUpload(event)">
        <div class="img-upload-hint" id="imgHint">點此上傳圖片</div>
        <img id="imgPreviewEl" style="display:none;width:100%;height:100%;object-fit:cover;position:absolute;inset:0;">
      </div>
    </div>

    <div class="filter-2col" style="margin-bottom:10px;">
      <div class="mfield" style="margin-bottom:0;">
        <label>角色編號</label>
        <input type="text" class="minput" id="newCharNo" placeholder="No.1001">
      </div>
      <div class="mfield" style="margin-bottom:0;">
        <label>角色名稱 *</label>
        <input type="text" class="minput" id="newName" placeholder="請輸入角色名稱">
      </div>
    </div>

    <div class="mfield">
      <label>屬性</label>
      <div class="attr-row" style="justify-content:flex-start;gap:6px;">
        <div class="attr-circle fire  active" id="mFire"  onclick="selectAttr('火')"></div>
        <div class="attr-circle water"        id="mWater" onclick="selectAttr('水')"></div>
        <div class="attr-circle wood"         id="mWood"  onclick="selectAttr('木')"></div>
        <div class="attr-circle light"        id="mLight" onclick="selectAttr('光')"></div>
        <div class="attr-circle dark"         id="mDark"  onclick="selectAttr('暗')"></div>
      </div>
    </div>

    <div class="mfield">
      <label>稀有度</label>
      <div class="sg4" id="mRarityGrid"></div>
    </div>

    <div class="filter-2col" style="margin-bottom:10px;">
      <div class="mfield" style="margin-bottom:0;">
        <label>擊種</label>
        <div class="sg2" id="mStrikeGrid"></div>
      </div>
      <div class="mfield" style="margin-bottom:0;">
        <label>戰型</label>
        <div class="sg2" id="mBattleGrid"></div>
      </div>
    </div>

    <div class="mfield">
      <label>進化狀態</label>
      <div class="cdd"><div class="cdd-hdr" onclick="toggleCdd(this)"><span class="cdd-lbl">未指定</span><span class="cdd-arr">▼</span></div>
      <div class="cdd-body sg3" id="mEvoBody"></div></div>
    </div>

    <div class="mfield">
      <label>種族（可多選）</label>
      <div class="cdd"><div class="cdd-hdr" onclick="toggleCdd(this)"><span class="cdd-lbl">選擇種族</span><span class="cdd-arr">▼</span></div>
      <div class="cdd-body sg4" id="mRaceBody"></div></div>
    </div>

    <div class="filter-2col" style="margin-bottom:10px;">
      <div class="mfield" style="margin-bottom:0;">
        <label>主友情技</label>
        <div class="cdd"><div class="cdd-hdr" onclick="toggleCdd(this)"><span class="cdd-lbl">未選擇</span><span class="cdd-arr">▼</span></div>
        <div class="cdd-body" id="mFriendMainBody">
          <input type="text" class="minput cdd-search" placeholder="🔍 搜尋..." oninput="filterCddSearch(this)">
          <div class="sg3" id="mFriendMainGrid"></div>
        </div></div>
      </div>
      <div class="mfield" style="margin-bottom:0;">
        <label>副友情技（可多選）</label>
        <div class="cdd"><div class="cdd-hdr" onclick="toggleCdd(this)"><span class="cdd-lbl">選擇副友情技</span><span class="cdd-arr">▼</span></div>
        <div class="cdd-body" id="mFriendSubBody">
          <input type="text" class="minput cdd-search" placeholder="🔍 搜尋..." oninput="filterCddSearch(this)">
          <div class="sg3" id="mFriendSubGrid"></div>
        </div></div>
      </div>
    </div>

    <div class="mfield">
      <label>英雄果實（可多選）</label>
      <div class="cdd"><div class="cdd-hdr" onclick="toggleCdd(this)"><span class="cdd-lbl">選擇英雄果實</span><span class="cdd-arr">▼</span></div>
      <div class="cdd-body" id="mHeroFruitBody"></div></div>
    </div>

    <div class="mfield">
      <label>入手方式（可多選）</label>
      <div class="sg3" id="mObtainGrid"></div>
    </div>

    <div class="mfield">
      <label>合作活動（輸入名稱）</label>
      <input type="text" class="minput" id="newCollab" placeholder="例：火影忍者、Love Live!">
    </div>

    <div class="accordion-section">
      <div class="accordion-header" onclick="toggleAcc(this)">
        技能（可多選）<span class="selected-count" id="cntSkill"></span>
        <span class="acc-arrow">▼</span>
      </div>
      <div class="accordion-body">
        <div class="sg3" id="mSkillGrid"></div>
        <div style="margin-top:8px;">
          <div class="drawer-lbl" style="margin-bottom:6px;">殺手（可多選，點選展開）</div>
          <div class="cdd"><div class="cdd-hdr" onclick="toggleCdd(this)"><span class="cdd-lbl">全部</span><span class="cdd-arr">▼</span></div>
          <div class="cdd-body" id="mKillerBody"></div></div>
        </div>
      </div>
    </div>

    <div class="accordion-section">
      <div class="accordion-header" onclick="toggleAcc(this)">
        超反技能（可多選）<span class="selected-count" id="cntSuper"></span>
        <span class="acc-arrow">▼</span>
      </div>
      <div class="accordion-body">
        <div class="sg3" id="mSuperGrid"></div>
      </div>
    </div>

    <div class="accordion-section">
      <div class="accordion-header" onclick="toggleAcc(this)">
        型態技能<span class="acc-arrow">▼</span>
      </div>
      <div class="accordion-body">
        <div id="mFormsContainer"></div>
        <span class="add-form-link" onclick="addFormRow()">＋ 新增型態</span>
      </div>
    </div>

    <div class="mbtnrow" style="margin-top:16px;">
      <button class="mcancel" onclick="closeModal()">取消</button>
      <button class="mconfirm" onclick="confirmChar()">確認</button>
    </div>
  </div>
</div>

let sortMode = 'no';
let sortDir = 'asc';

function setSort(mode, btn) {
  sortMode = mode;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function toggleSortDir() {
  sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  document.getElementById('sortDirBtn').textContent = sortDir === 'asc' ? '↑ 正序' : '↓ 倒序';
  renderList();
}

function sortChars(arr) {
  const attrOrder = {'火':0,'水':1,'木':2,'光':3,'暗':4};
  const dir = sortDir === 'asc' ? 1 : -1;
  return [...arr].sort((a, b) => {
    let r = 0;
    if (sortMode === 'no') {
      const na = parseInt((a.charNo||'').replace(/\D/g,'')) || 99999;
      const nb = parseInt((b.charNo||'').replace(/\D/g,'')) || 99999;
      r = na - nb;
    } else if (sortMode === 'name') {
      r = (a.name||'').localeCompare(b.name||'', 'zh-Hant');
    } else if (sortMode === 'attr') {
      const oa = attrOrder[a.attribute]??5, ob = attrOrder[b.attribute]??5;
      if (oa !== ob) r = oa - ob;
      else {
        const na = parseInt((a.charNo||'').replace(/\D/g,'')) || 99999;
        const nb = parseInt((b.charNo||'').replace(/\D/g,'')) || 99999;
        r = na - nb;
      }
    }
    return r * dir;
  });
}

const mSets = { races:new Set(), friendSkillsSub:new Set(), heroFruits:new Set(), skills:new Set(), superSkills:new Set(), obtain:new Set() };
// modal single-select states
let mRarity = '6', mStrike = '反射型', mBattle = '平衡', mEvo = '', mFriendMain = '';

// ── 初始化 ───────────────────────────────────────────
function init() {
  // 按鈕格（不是下拉的）
  buildGrid('fSkillGrid',  SKILLS,       'skills',       'sg3', true);
  buildGrid('fSuperGrid',  SUPER_SKILLS, 'superSkills',  'sg3', true);
  buildGrid('fStrikeGrid', STRIKE_TYPES, 'strikeType',   'sg2', true);
  buildGrid('fHeroFruitGrid', ['有英雄果實','無英雄果實'], 'heroFruits', 'sg2', true);
  buildGrid('fOwnedGrid',  ['已擁有','未擁有'], 'owned', 'sg2', true);
  buildGrid('mSkillGrid',  SKILLS,       'skills',       'sg3', false);
  buildGrid('mSuperGrid',  SUPER_SKILLS, 'superSkills',  'sg3', false);
  buildGrid('mObtainGrid', OBTAIN,       'obtain',       'sg3', false);
  // 表單單選按鈕格
  buildSingleGrid('mRarityGrid', RARITIES, v => { mRarity = v.replace('★',''); }, () => mRarity, r => '★'+r);
  buildSingleGrid('mStrikeGrid', STRIKE_TYPES, v => { mStrike = v; }, () => mStrike);
  buildSingleGrid('mBattleGrid', BATTLE_TYPES, v => { mBattle = v; }, () => mBattle);
  // 下拉內容（篩選）
  buildCddBody('fBattleBody', BATTLE_TYPES, 'battleType', true);
  buildCddBody('fRarityBody', RARITIES,     'rarity',     true);
  buildCddBody('fRaceBody',   RACES,        'races',      true);
  buildCddBody('fEvoBody',    EVO_STATES,   'evo',        true);
  buildCddBody('fObtainBody', OBTAIN,       'obtain',     true);
  // 友情技（主單選／副可複選，皆可搜尋）
  buildFriendGrid('fFriendMainGrid', null,             true, true);
  buildFriendGrid('fFriendSubGrid',  'friendSkillsSub', true, false);
  // 下拉內容（表單）
  buildCddBody('mEvoBody',      EVO_STATES,    'evo',         false, true);
  buildCddBody('mRaceBody',     RACES,         'races',       false);
  buildFriendGrid('mFriendMainGrid', null,             false, true);
  buildFriendGrid('mFriendSubGrid',  'friendSkillsSub', false, false);
  buildHFCdd('mHeroFruitBody', false);
  buildKillerCdd('fKillerBody', true);
  buildKillerCdd('mKillerBody', false);
  document.getElementById('searchBox').addEventListener('input', renderList);
  enhanceEggIcons();
}

// 殺手（分組：屬性殺手／種族殺手／其他，選項併入 skills）
function buildKillerCdd(bodyId, isFilter) {
  const body = document.getElementById(bodyId); if(!body) return;
  body.innerHTML = '';
  const set = isFilter ? fSets.skills : mSets.skills;
  Object.entries(KILLER_GROUPS).forEach(([cat, items]) => {
    const grp = document.createElement('div'); grp.className='hf-group';
    grp.innerHTML = `<div class="hf-group-label">${cat}</div>`;
    const grid = document.createElement('div'); grid.className='sg4';
    items.forEach(label => {
      const val = label + '殺手';
      const b = document.createElement('div'); b.className='skill-btn'; b.textContent=label; b.dataset.val=val;
      if (set.has(val)) b.classList.add('active');
      b.onclick = () => {
        toggleSet(b, 'skills', val, isFilter);
        updateCddLabel(b.closest('.cdd'));
        if (isFilter) renderList(); else updateCntBadge('cntSkill','skills','cntSuper','superSkills');
      };
      grid.appendChild(b);
    });
    grp.appendChild(grid); body.appendChild(grp);
  });
}

// ── 友情技（主／副）建構 ───────────────────────────────
function buildFriendGrid(gridId, key, isFilter, singleSelect) {
  const c = document.getElementById(gridId); if(!c) return;
  c.innerHTML = '';
  FRIEND_SKILLS.forEach(item => {
    const b = mkBtn(item);
    b.onclick = () => {
      if (singleSelect) {
        const cur = isFilter ? filterFriendMain : mFriendMain;
        const next = cur === item ? '' : item;
        if (isFilter) filterFriendMain = next; else mFriendMain = next;
        c.querySelectorAll('.skill-btn').forEach(x => x.classList.toggle('active', x.dataset.val === next));
      } else {
        toggleSet(b, key, item, isFilter);
      }
      updateCddLabel(c.closest('.cdd'));
      if (isFilter) renderList();
    };
    c.appendChild(b);
  });
}

// 下拉搜尋框：依輸入文字過濾緊接在後面的按鈕格
function filterCddSearch(input) {
  const term = input.value.trim();
  const grid = input.nextElementSibling;
  if (!grid) return;
  grid.querySelectorAll('.skill-btn').forEach(b => {
    b.style.display = (term === '' || b.textContent.includes(term)) ? '' : 'none';
  });
}

// 幸運轉蛋🥚 → 換成金蛋圖示
function enhanceEggIcons() {
  document.querySelectorAll('.skill-btn').forEach(b => {
    if (b.dataset.val && b.dataset.val.includes('🥚') && !b.querySelector('img')) {
      const label = b.dataset.val.replace('🥚','').trim();
      b.innerHTML = `${label}<img src="${EGG_ICON_B64}" class="egg-icon" alt="金蛋">`;
    }
  });
}

// ── Grid 建構函式 ─────────────────────────────────────
function buildGrid(containerId, items, key, cls, isFilter) {
  const c = document.getElementById(containerId); if(!c) return;
  c.className = cls; c.innerHTML = '';
  items.forEach(item => {
    const b = mkBtn(item);
    b.onclick = () => { toggleSet(b, key, item, isFilter); if(isFilter) renderList(); else updateCntBadge('cntSkill','skills','cntSuper','superSkills'); };
    c.appendChild(b);
  });
}

function buildSingleGrid(containerId, items, setter, getter, valMapper) {
  const c = document.getElementById(containerId); if(!c) return;
  c.innerHTML = '';
  const update = () => { c.querySelectorAll('.skill-btn').forEach(b => b.classList.toggle('active', b.dataset.val === getter())); };
  items.forEach(item => {
    const displayVal = valMapper ? valMapper(item) : item;
    const b = mkBtn(item); b.dataset.val = item; b.textContent = displayVal || item;
    b.onclick = () => { setter(item); update(); };
    c.appendChild(b);
  });
  update();
}

function buildCddBody(bodyId, items, key, isFilter, singleSelect) {
  const body = document.getElementById(bodyId); if(!body) return;
  body.innerHTML = '';
  items.forEach(item => {
    const b = mkBtn(item);
    b.onclick = () => {
      if (singleSelect) {
        body.querySelectorAll('.skill-btn').forEach(x => x.classList.remove('active'));
        b.classList.toggle('active', !b.classList.contains('active') || true);
        if (singleSelect) { mEvo = b.classList.contains('active') ? item : ''; }
        updateCddLabel(b.closest('.cdd'));
        return;
      }
      toggleSet(b, key, item, isFilter);
      updateCddLabel(b.closest('.cdd'));
      if(isFilter) renderList();
    };
    body.appendChild(b);
  });
}

function buildHFCdd(bodyId, isFilter) {
  const body = document.getElementById(bodyId); if(!body) return;
  body.innerHTML = '';
  Object.entries(HERO_FRUITS).forEach(([cat, items]) => {
    const grp = document.createElement('div'); grp.className='hf-group';
    grp.innerHTML = `<div class="hf-group-label">${cat}</div>`;
    const grid = document.createElement('div'); grid.className='sg4';
    items.forEach(item => {
      const b = mkBtn(item);
      b.onclick = () => { toggleSet(b, 'heroFruits', item, isFilter); updateCddLabel(b.closest('.cdd')); if(isFilter) renderList(); };
      grid.appendChild(b);
    });
    grp.appendChild(grid); body.appendChild(grp);
  });
}

function buildCollabFilter() {
  const body = document.getElementById('fCollabBody'); if(!body) return;
  const collabs = [...new Set(characters.map(c => c.collab).filter(Boolean))].sort();
  const cdd = body.closest('.cdd');
  body.innerHTML = '';
  body.className = 'cdd-body ' + (collabs.length > 6 ? 'sg3' : 'sg2');
  if (!collabs.length) { body.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:6px 4px;">尚無合作活動資料</div>'; return; }
  collabs.forEach(collab => {
    const b = mkBtn(collab);
    if (fSets.collab.has(collab)) b.classList.add('active');
    b.onclick = () => { toggleSet(b, 'collab', collab, true); updateCddLabel(cdd); renderList(); };
    body.appendChild(b);
  });
}

function mkBtn(text) {
  const b = document.createElement('div'); b.className='skill-btn'; b.textContent=text; b.dataset.val=text; return b;
}

// ── Toggle 工具 ──────────────────────────────────────
function toggleSet(btn, key, val, isFilter) {
  const set = isFilter ? fSets[key] : mSets[key];
  if(set.has(val)) { set.delete(val); btn.classList.remove('active'); }
  else             { set.add(val);    btn.classList.add('active'); }
}

function toggleCdd(hdr) {
  hdr.classList.toggle('open');
  hdr.nextElementSibling?.classList.toggle('open');
}

function updateCddLabel(cdd) {
  if(!cdd) return;
  const lbl = cdd.querySelector('.cdd-lbl'); if(!lbl) return;
  const actives = cdd.querySelectorAll('.skill-btn.active');
  lbl.textContent = actives.length===0 ? '全部' : actives.length===1 ? actives[0].textContent : `已選 ${actives.length} 項`;
}

function updateCntBadge(id1, key1, id2, key2) {
  const e1=document.getElementById(id1), e2=document.getElementById(id2);
  if(e1) e1.textContent = mSets[key1].size>0 ? `已選 ${mSets[key1].size}` : '';
  if(e2) e2.textContent = mSets[key2].size>0 ? `已選 ${mSets[key2].size}` : '';
}

// ── 屬性篩選 ─────────────────────────────────────────
function setAttr(btn) {
  document.querySelectorAll('.attr-row .attr-circle').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); filterAttr=btn.dataset.attr; renderList();
}

// ── 篩選邏輯 ─────────────────────────────────────────
function getFiltered() {
  const q = document.getElementById('searchBox').value.trim();
  ensureAcc(activeAccount);
  const d = collections[activeAccount];
  return characters.filter(c => {
    if(q && !c.name.includes(q)) return false;
    if(filterAttr && c.attribute!==filterAttr) return false;
    if(fSets.rarity.size>0  && !fSets.rarity.has(`★${c.rarity}`)) return false;
    if(fSets.strikeType.size>0 && !fSets.strikeType.has(c.strikeType)) return false;
    if(fSets.battleType.size>0 && !fSets.battleType.has(c.battleType)) return false;
    if(fSets.evo.size>0     && !fSets.evo.has(c.evolutionState)) return false;
    if(fSets.collab.size>0  && !fSets.collab.has(c.collab||'')) return false;
    if(fSets.heroFruits.size>0) {
      const hf = c.heroFruits||[];
      const wantHas = fSets.heroFruits.has('有英雄果實'), wantNo = fSets.heroFruits.has('無英雄果實');
      if(wantHas && !wantNo && hf.length===0) return false;
      if(wantNo  && !wantHas && hf.length>0)  return false;
    }
    for(const s of fSets.skills)       if(!(c.skills||[]).includes(s))       return false;
    for(const s of fSets.superSkills)  if(!(c.superSkills||[]).includes(s))  return false;
    for(const s of fSets.races)        if(!(c.races||[]).includes(s))        return false;
    if(filterFriendMain && c.friendSkillMain !== filterFriendMain) return false;
    for(const s of fSets.friendSkillsSub) if(!(c.friendSkillsSub||[]).includes(s)) return false;
    for(const s of fSets.obtain)       if(!(c.obtainMethods||[]).includes(s)) return false;
    if(fSets.owned.size>0) {
      const owned = !!(d[c.id] && d[c.id].owned);
      if(fSets.owned.has('已擁有') && !fSets.owned.has('未擁有') && !owned) return false;
      if(fSets.owned.has('未擁有') && !fSets.owned.has('已擁有') && owned)  return false;
    }
    return true;
  });
}

function resetFilter() {
  Object.values(fSets).forEach(s=>s.clear()); filterAttr=''; filterFriendMain='';
  document.querySelectorAll('.filter-drawer .skill-btn.active').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.filter-drawer .cdd-lbl').forEach(lbl=>lbl.textContent='全部');
  document.querySelectorAll('.attr-row .attr-circle').forEach(b=>b.classList.remove('active'));
  document.querySelector('.attr-row .attr-circle[data-attr=""]').classList.add('active');
  renderList();
}

// ── Render ───────────────────────────────────────────
function renderStats() {
  ensureAcc(activeAccount); const d=collections[activeAccount];
  const tot=characters.length, own=characters.filter(c=>d[c.id]&&d[c.id].owned);
  const oc=own.length, dc=own.filter(c=>d[c.id].count>1).length;
  const rate=tot?((oc/tot)*100).toFixed(1):'0.0', dr=oc?((dc/oc)*100).toFixed(1):'0.0';
  document.getElementById('statsArea').innerHTML=`
    <div class="stat-card"><div class="stat-num">${oc}<span class="stat-total">/${tot}</span></div><div class="stat-lbl">已收集角色數</div></div>
    <div class="stat-card"><div class="stat-num">${rate}<span class="stat-total">%</span></div><div class="stat-lbl">收集率</div></div>
    <div class="stat-card"><div class="stat-num">${dc}</div><div class="stat-lbl">重複角色數</div></div>
    <div class="stat-card"><div class="stat-num">${dr}<span class="stat-total">%</span></div><div class="stat-lbl">重複率</div></div>`;
}

function renderList() {
  const grid=document.getElementById('charGrid'); grid.innerHTML='';
  ensureAcc(activeAccount); const d=collections[activeAccount];
  const filtered=sortChars(getFiltered());
  if(!filtered.length) {
    grid.innerHTML=`<div class="empty-state"><div class="eicon">📦</div><div class="etxt">${characters.length===0?'尚未新增任何角色':'沒有符合條件的角色'}</div><div class="esub">${characters.length===0?'點下方 ＋ 新增第一隻角色':''}</div></div>`; return;
  }
  filtered.forEach(c => {
    const entry=d[c.id]||{owned:false,count:0};
    const card=document.createElement('div');
    card.className='char-card'+(entry.owned?' owned':' not-owned');
    card.innerHTML=`
      <div class="card-img ${c.imageData?'':'bg-'+c.attribute}">
        ${c.imageData?`<img src="${c.imageData}" alt="${c.name}">`:`<span class="card-placeholder">${ATTR_EMOJI[c.attribute]||'？'}</span>`}
      </div>
      ${c.charNo?`<div class="card-no-top">${c.charNo}</div>`:''}
      <div class="card-attr attr-${c.attribute}"></div>
      <div class="card-edit" onclick="event.stopPropagation();openEditModal(${c.id})">✎</div>
      ${entry.owned?'<div class="card-check">✓</div>':''}
      <div class="card-name-bar">${c.name}</div>`;
    card.onclick=()=>toggleOwned(c.id);
    grid.appendChild(card);
  });
}

function renderTabs() {
  const wrap=document.getElementById('accountTabs'); wrap.innerHTML='';
  accounts.forEach(acc => {
    const tab=document.createElement('div'); tab.className='acc-tab'+(acc.id===activeAccount?' active':'');
    const ns=document.createElement('span'); ns.textContent=acc.name; ns.style.cursor='pointer';
    ns.onclick=()=>{activeAccount=acc.id;renderAll();};
    const eb=document.createElement('span'); eb.className='acc-edit'; eb.textContent='✎';
    eb.onclick=e=>{e.stopPropagation(); const n=prompt('帳號名稱:',acc.name); if(n&&n.trim()){acc.name=n.trim();saveState();renderAll();}};
    tab.appendChild(ns); tab.appendChild(eb); wrap.appendChild(tab);
  });
}

function renderAll() { renderTabs(); renderStats(); renderList(); buildCollabFilter(); }

// ── 收藏操作 ─────────────────────────────────────────
function ensureAcc(id){if(!collections[id])collections[id]={};}
function toggleOwned(id){
  ensureAcc(activeAccount); const d=collections[activeAccount];
  if(!d[id])d[id]={owned:false,count:0};
  d[id].owned=!d[id].owned; d[id].count=d[id].owned?Math.max(1,d[id].count):0;
  saveState(); renderAll();
}
function saveState(){hasUnsaved=true;document.getElementById('unsavedBadge').style.display='inline-block';}
window.addEventListener('beforeunload',e=>{if(hasUnsaved){e.preventDefault();e.returnValue='';}});

// ── 篩選抽屜 ─────────────────────────────────────────
function openFilter(){
  buildCollabFilter();
  document.getElementById('filterDrawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
}
function closeFilter(){
  document.getElementById('filterDrawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}
function toggleAcc(hdr){
  hdr.classList.toggle('open');
  hdr.nextElementSibling?.classList.toggle('open');
}

// ── Modal ────────────────────────────────────────────
function selectAttr(attr){
  modalAttr=attr;
  ['火','水','木','光','暗'].forEach(a=>{
    const m={'火':'mFire','水':'mWater','木':'mWood','光':'mLight','暗':'mDark'};
    document.getElementById(m[a])?.classList.toggle('active',a===attr);
  });
}

function resetModalSets(){
  Object.values(mSets).forEach(s=>s.clear());
  document.querySelectorAll('#addCharModal .skill-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#addCharModal .cdd-lbl').forEach(lbl=>{
    lbl.textContent=lbl.closest('.mfield')?.querySelector('label')?.textContent.includes('選擇')?'全部':'全部';
  });
}

function clearModalForm(){
  uploadedImg=null; mRarity='6'; mStrike='反射型'; mBattle='平衡'; mEvo=''; mFriendMain='';
  document.getElementById('imgPreviewEl').style.display='none';
  document.getElementById('imgHint').style.display='block';
  document.getElementById('newCharNo').value='';
  document.getElementById('newName').value='';
  document.getElementById('newCollab').value='';
  document.getElementById('mFormsContainer').innerHTML='';
  resetModalSets(); selectAttr('火');
  // refresh single-select grids
  ['mRarityGrid','mStrikeGrid','mBattleGrid'].forEach(id=>{
    const c=document.getElementById(id); if(c) c.querySelectorAll('.skill-btn').forEach(b=>{
      if(id==='mRarityGrid') b.classList.toggle('active',b.dataset.val==='★6');
      if(id==='mStrikeGrid') b.classList.toggle('active',b.dataset.val==='反射型');
      if(id==='mBattleGrid') b.classList.toggle('active',b.dataset.val==='平衡');
    });
  });
}

function prefillModal(c){
  uploadedImg=c.imageData||null;
  const imgEl=document.getElementById('imgPreviewEl'), hint=document.getElementById('imgHint');
  if(c.imageData){imgEl.src=c.imageData;imgEl.style.display='block';hint.style.display='none';}
  else{imgEl.style.display='none';hint.style.display='block';}
  document.getElementById('newCharNo').value=c.charNo||'';
  document.getElementById('newName').value=c.name||'';
  document.getElementById('newCollab').value=c.collab||'';
  mRarity=String(c.rarity||6); mStrike=c.strikeType||'反射型'; mBattle=c.battleType||'平衡'; mEvo=c.evolutionState||'';
  selectAttr(c.attribute||'火');

  const activateSet=(setKey, arr, bodyId, isCdd)=>{
    mSets[setKey].clear(); (arr||[]).forEach(v=>mSets[setKey].add(v));
    const container=document.getElementById(bodyId); if(!container) return;
    container.querySelectorAll('.skill-btn').forEach(b=>{
      b.classList.toggle('active', mSets[setKey].has(b.dataset.val));
    });
    if(isCdd) updateCddLabel(container.closest('.cdd'));
  };
  activateSet('races',        c.races,          'mRaceBody',      true);
  activateSet('friendSkillsSub', c.friendSkillsSub, 'mFriendSubGrid', true);
  activateSet('heroFruits',   c.heroFruits,     'mHeroFruitBody', true);
  activateSet('skills',       c.skills,         'mSkillGrid',     false);
  activateSet('superSkills',  c.superSkills,    'mSuperGrid',     false);
  activateSet('obtain',       c.obtainMethods,  'mObtainGrid',    false);

  const killerBody = document.getElementById('mKillerBody');
  if (killerBody) {
    killerBody.querySelectorAll('.skill-btn').forEach(b => b.classList.toggle('active', mSets.skills.has(b.dataset.val)));
    updateCddLabel(killerBody.closest('.cdd'));
  }

  mFriendMain = c.friendSkillMain || '';
  const mainGrid = document.getElementById('mFriendMainGrid');
  if (mainGrid) {
    mainGrid.querySelectorAll('.skill-btn').forEach(b => b.classList.toggle('active', b.dataset.val === mFriendMain));
    updateCddLabel(mainGrid.closest('.cdd'));
  }

  // single-select grids
  ['mRarityGrid','mStrikeGrid','mBattleGrid','mEvoBody'].forEach(id=>{
    const cont=document.getElementById(id); if(!cont) return;
    cont.querySelectorAll('.skill-btn').forEach(b=>{
      if(id==='mRarityGrid')b.classList.toggle('active',b.dataset.val===`★${mRarity}`);
      if(id==='mStrikeGrid')b.classList.toggle('active',b.dataset.val===mStrike);
      if(id==='mBattleGrid')b.classList.toggle('active',b.dataset.val===mBattle);
      if(id==='mEvoBody'){b.classList.toggle('active',b.dataset.val===mEvo); if(b.dataset.val===mEvo)updateCddLabel(b.closest('.cdd'));}
    });
  });
  document.getElementById('mFormsContainer').innerHTML='';
  (c.forms||[]).forEach(f=>addFormRow(f));
  updateCntBadge('cntSkill','skills','cntSuper','superSkills');
}

function openAddModal(){editCharId=null;document.getElementById('modalTitle').textContent='新增角色';clearModalForm();addFormRow({formName:'進化前'});document.getElementById('addCharModal').classList.add('open');}
function openEditModal(id){
  editCharId=id; const c=characters.find(x=>x.id===id); if(!c)return;
  document.getElementById('modalTitle').textContent='編輯角色';clearModalForm();prefillModal(c);document.getElementById('addCharModal').classList.add('open');
}
function closeModal(){document.getElementById('addCharModal').classList.remove('open');}

function confirmChar(){
  const name=document.getElementById('newName').value.trim(); if(!name){alert('請輸入角色名稱');return;}
  const forms=[]; document.querySelectorAll('.form-row-box').forEach(row=>{
    const fn=row.querySelector('.fname').value.trim(), fa=row.querySelector('.factive').value.trim(), fp=row.querySelector('.fpassive').value.trim(), ff=row.querySelector('.ffriend').value.trim();
    if(fn||fa||fp||ff)forms.push({formName:fn||'型態',active:fa,passive:fp,friend:ff});
  });
  const data={charNo:document.getElementById('newCharNo').value.trim(),name,attribute:modalAttr,rarity:parseInt(mRarity),strikeType:mStrike,battleType:mBattle,evolutionState:mEvo,collab:document.getElementById('newCollab').value.trim(),races:[...mSets.races],friendSkillMain:mFriendMain,friendSkillsSub:[...mSets.friendSkillsSub],heroFruits:[...mSets.heroFruits],skills:[...mSets.skills],superSkills:[...mSets.superSkills],obtainMethods:[...mSets.obtain],imageData:uploadedImg,forms};
  if(editCharId!==null){const idx=characters.findIndex(x=>x.id===editCharId);if(idx>=0)characters[idx]={id:editCharId,...data};}
  else{const maxId=characters.reduce((m,c)=>Math.max(m,c.id||0),0);characters.push({id:maxId+1,...data});}
  closeModal(); saveState(); renderAll();
}

function addFormRow(prefill){
  const c=document.getElementById('mFormsContainer');
  const row=document.createElement('div'); row.className='form-row-box';
  row.innerHTML=`<div class="form-row-head"><input type="text" class="minput fname" placeholder="型態名稱" style="flex:1" value="${prefill?.formName||''}"><span class="remove-form" onclick="this.closest('.form-row-box').remove()">✕</span></div><textarea class="mtarea factive" placeholder="主動技">${prefill?.active||''}</textarea><textarea class="mtarea fpassive" placeholder="被動技能（選填）">${prefill?.passive||''}</textarea><textarea class="mtarea ffriend" placeholder="型態友情技（選填）">${prefill?.friend||''}</textarea>`;
  c.appendChild(row);
}

function handleImgUpload(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    uploadedImg=reader.result;
    const imgEl=document.getElementById('imgPreviewEl'); imgEl.src=uploadedImg; imgEl.style.display='block';
    document.getElementById('imgHint').style.display='none';
  };
  reader.readAsDataURL(file);
}

// ── 備份（單一檔案）─────────────────────────────────
function exportBackup(){
  dl(JSON.stringify({version:1,accounts,collections,characters},null,2),'backup.json');
  hasUnsaved=false; document.getElementById('unsavedBadge').style.display='none';
}
function importBackup(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(data.accounts)accounts=data.accounts;
      if(data.collections)collections=data.collections;
      if(data.characters)characters=migrateCharacters(data.characters);
      activeAccount=accounts[0]?.id||'a1';
      hasUnsaved=false; document.getElementById('unsavedBadge').style.display='none';
      renderAll(); alert('匯入完成');
    }catch{alert('匯入失敗，檔案格式錯誤');}
  };
  reader.readAsText(file);
}
function dl(content,filename){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'application/json'}));a.download=filename;a.click();}

// 舊資料相容：友情技原本是單一陣列 friendSkills，遷移成 friendSkillMain + friendSkillsSub
function migrateCharacters(list){
  (list||[]).forEach(c=>{
    if(c.friendSkills && !c.friendSkillsSub){ c.friendSkillsSub = c.friendSkills; delete c.friendSkills; }
    if(c.friendSkillMain === undefined) c.friendSkillMain = '';
    if(c.friendSkillsSub === undefined) c.friendSkillsSub = [];
  });
  return list;
}

// ── 載入 ─────────────────────────────────────────────
fetch('backup.json')
  .then(r=>r.json())
  .then(data=>{
    if(data.accounts)accounts=data.accounts;
    if(data.collections)collections=data.collections;
    if(data.characters)characters=migrateCharacters(data.characters);
    activeAccount=accounts[0]?.id||'a1';
    init(); renderAll();
  })
  .catch(()=>{init();renderAll();});
</script>
