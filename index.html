<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>怪物彈珠 角色收藏管理</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#161a1f; --panel2:#1d2228; --border:#2a3038;
    --text:#e8eaed; --sub:#9aa3ad; --accent:#3478f6; --accent2:#1e2c4a;
    --good:#3ddc84; --warn:#f5a623; --bad:#e0524f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{background:var(--bg); color:var(--text); font-family:"Microsoft JhengHei","PingFang TC",sans-serif; margin:0; padding:0;}

  header{padding:14px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:10;}
  header .title-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  header h1{font-size:17px; margin:0;}
  #unsavedBadge{font-size:11px; background:var(--warn); color:#000; padding:3px 8px; border-radius:6px; display:none;}

  /* 帳號分頁：點擊=切換，鉛筆=改名，兩個動作分開避免誤觸 */
  .accounts{display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px;}
  .account-tab{
    display:flex; align-items:center; gap:6px; flex-shrink:0;
    padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--panel);
    font-size:14px; min-height:44px;
  }
  .account-tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .account-tab .acc-name{cursor:pointer; white-space:nowrap; padding:2px;}
  .account-tab .edit-btn{
    width:26px; height:26px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    border-radius:6px; background:rgba(255,255,255,0.12); cursor:pointer; font-size:13px;
  }
  .account-tab .edit-btn:hover{background:rgba(255,255,255,0.25);}

  main{padding:14px 16px 100px; max-width:900px; margin:0 auto;}

  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .toolbar input[type=text]{flex:1 1 100%;}
  .toolbar input[type=text], .toolbar select{
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius:10px; font-size:15px; min-height:44px;
  }
  .toolbar select{flex:1 1 auto;}

  .stats{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:16px;}
  .stat-card{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px;}
  .stat-card .num{font-size:20px; font-weight:bold;}
  .stat-card .label{font-size:11px; color:var(--sub); margin-top:2px;}

  /* 角色卡片（取代表格，手機友善） */
  .char-list{display:flex; flex-direction:column; gap:8px;}
  .char-card{
    display:flex; align-items:center; gap:12px;
    background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 12px;
  }
  .char-card.owned{background:rgba(61,220,132,0.08); border-color:rgba(61,220,132,0.3);}
  .char-info{flex:1; min-width:0;}
  .char-name{font-size:15px; font-weight:bold; margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;}
  .char-name::after{content:' ▾'; font-size:11px; color:var(--sub);}
  .char-skills{display:none; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); font-size:12.5px; color:var(--sub); line-height:1.6;}
  .char-skills.show{display:block;}
  .char-skills b{color:var(--text);}
  .char-meta{display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--sub);}
  .badge{display:inline-block; padding:2px 8px; border-radius:6px; font-size:12px;}
  .b-火{background:#4a1b0c;color:#f0997b;} .b-水{background:#042c53;color:#85b7eb;}
  .b-木{background:#173404;color:#97c459;} .b-光{background:#412402;color:#ef9f27;}
  .b-闇{background:#26215c;color:#7f77dd;}
  .stars{color:var(--warn);}

  .char-controls{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .owned-toggle{
    width:48px; height:48px; border-radius:12px; border:2px solid var(--border);
    background:var(--panel2); display:flex; align-items:center; justify-content:center;
    font-size:22px; cursor:pointer; flex-shrink:0;
  }
  .owned-toggle.on{background:var(--good); border-color:var(--good); color:#06291a;}
  .count-stepper{display:flex; align-items:center; gap:4px;}
  .count-stepper button{
    width:36px; height:36px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text); font-size:18px; cursor:pointer; padding:0;
  }
  .count-stepper .count-val{min-width:24px; text-align:center; font-size:15px;}

  .actions{
    position:fixed; bottom:0; left:0; right:0; padding:12px 16px;
    background:var(--bg); border-top:1px solid var(--border);
    display:flex; gap:10px; z-index:10;
  }
  .actions button{flex:1; min-height:48px; font-size:15px;}
  button{background:var(--accent2); border:1px solid var(--accent); color:var(--text); padding:10px 14px; border-radius:10px; cursor:pointer;}
  button:hover{filter:brightness(1.15);}
  .empty-hint{color:var(--sub); font-size:13px; margin-top:10px;}

  @media (min-width: 640px){
    .stats{grid-template-columns:repeat(4,1fr);}
    .toolbar input[type=text]{flex:1 1 auto;}
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>怪物彈珠 角色收藏管理</h1>
    <span id="unsavedBadge">未匯出</span>
  </div>
  <div class="accounts" id="accountTabs"></div>
</header>

<main>
  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="搜尋角色名稱...">
    <select id="attrFilter">
      <option value="">全屬性</option>
      <option value="火">火</option><option value="水">水</option><option value="木">木</option>
      <option value="光">光</option><option value="闇">闇</option>
    </select>
    <select id="rarityFilter">
      <option value="">全稀有度</option>
      <option value="3">★3</option><option value="4">★4</option><option value="5">★5</option><option value="6">★6</option>
    </select>
    <select id="ownedFilter">
      <option value="">全部</option>
      <option value="owned">已擁有</option>
      <option value="missing">未擁有</option>
    </select>
    <button id="addCharBtn" style="flex:1 1 100%;">＋ 新增角色</button>
  </div>

  <div class="stats" id="statsArea"></div>

  <div class="char-list" id="charList"></div>
  <div class="empty-hint">資料來源:characters.json(目前為範例資料,可自行擴充)</div>
</main>

<!-- 新增角色彈出表單 -->
<div id="addCharModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50; align-items:center; justify-content:center; padding:20px;">
  <div style="background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px; width:100%; max-width:380px; max-height:85vh; overflow-y:auto;">
    <h2 style="margin:0 0 14px; font-size:17px;">新增角色</h2>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <input type="text" id="newCharName" placeholder="角色名稱" style="padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:15px;">
      <select id="newCharAttr" style="padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:15px;">
        <option value="火">火</option><option value="水">水</option><option value="木">木</option>
        <option value="光">光</option><option value="闇">闇</option>
      </select>
      <select id="newCharRarity" style="padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:15px;">
        <option value="3">★3</option><option value="4">★4</option><option value="5">★5</option><option value="6" selected>★6</option>
      </select>
      <textarea id="newCharRace" placeholder="種族(選填)" rows="1" style="padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:15px; resize:vertical; font-family:inherit;"></textarea>
      <select id="newCharType" style="padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:15px;">
        <option value="反射型">反射型</option><option value="貫穿型">貫穿型</option><option value="砲擊型">砲擊型</option><option value="速度型">速度型</option>
      </select>
      <div style="border-top:1px solid var(--border); margin-top:4px; padding-top:10px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
          <span style="font-size:13px; color:var(--sub);">型態技能(進化前/獸神化等可分別新增)</span>
          <button id="addFormBtn" type="button" style="padding:4px 10px; font-size:12px;">＋ 新增型態</button>
        </div>
        <div id="formsContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
      </div>
    </div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button id="cancelAddChar" style="flex:1; background:var(--panel2); border-color:var(--border);">取消</button>
      <button id="confirmAddChar" style="flex:1;">新增</button>
    </div>
  </div>
</div>

<div class="actions">
  <button onclick="exportData()">⬇ 匯出收藏</button>
  <button onclick="exportCharacters()">⬇ 匯出角色清單</button>
  <button onclick="document.getElementById('importFile').click()">⬆ 匯入收藏</button>
  <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
</div>

<script>
let characters = [];
let accounts = [
  {id:'a1', name:'帳號1'}, {id:'a2', name:'帳號2'}, {id:'a3', name:'帳號3'}, {id:'a4', name:'帳號4'}
];
let collections = {}; // { accountId: { charId: {owned:bool, count:n} } }
let activeAccount = accounts[0].id;
let hasUnsavedChanges = false;

function saveState(){
  hasUnsavedChanges = true;
  updateUnsavedBadge();
}
function updateUnsavedBadge(){
  const badge = document.getElementById('unsavedBadge');
  if(badge) badge.style.display = hasUnsavedChanges ? 'inline-block' : 'none';
}
window.addEventListener('beforeunload', (e)=>{
  if(hasUnsavedChanges || charactersChanged){ e.preventDefault(); e.returnValue = ''; }
});

function ensureAccountData(accId){
  if(!collections[accId]) collections[accId] = {};
}

function renderTabs(){
  const wrap = document.getElementById('accountTabs');
  wrap.innerHTML = '';
  accounts.forEach(acc=>{
    const tab = document.createElement('div');
    tab.className = 'account-tab' + (acc.id===activeAccount ? ' active' : '');

    const nameSpan = document.createElement('span');
    nameSpan.className = 'acc-name';
    nameSpan.textContent = acc.name;
    nameSpan.onclick = ()=>{ activeAccount = acc.id; saveState_noFlag(); renderAll(); };
    tab.appendChild(nameSpan);

    const editBtn = document.createElement('span');
    editBtn.className = 'edit-btn';
    editBtn.textContent = '✎';
    editBtn.onclick = (e)=>{
      e.stopPropagation();
      const newName = prompt('帳號名稱:', acc.name);
      if(newName && newName.trim()){
        acc.name = newName.trim();
        saveState();
        renderAll();
      }
    };
    tab.appendChild(editBtn);

    wrap.appendChild(tab);
  });
}
// 切換帳號本身不算「資料變更」，不需要跳未儲存提示
function saveState_noFlag(){}

function getFiltered(){
  const q = document.getElementById('searchBox').value.trim();
  const attr = document.getElementById('attrFilter').value;
  const rarity = document.getElementById('rarityFilter').value;
  const ownedF = document.getElementById('ownedFilter').value;
  ensureAccountData(activeAccount);
  const accData = collections[activeAccount];
  return characters.filter(c=>{
    if(q && !c.name.includes(q)) return false;
    if(attr && c.attribute !== attr) return false;
    if(rarity && String(c.rarity) !== rarity) return false;
    const owned = !!(accData[c.id] && accData[c.id].owned);
    if(ownedF==='owned' && !owned) return false;
    if(ownedF==='missing' && owned) return false;
    return true;
  });
}

function setOwned(id, owned){
  ensureAccountData(activeAccount);
  const accData = collections[activeAccount];
  if(!accData[id]) accData[id] = {owned:false, count:0};
  accData[id].owned = owned;
  accData[id].count = owned ? Math.max(1, accData[id].count||0) : 0;
  saveState();
  renderAll();
}

function changeCount(id, delta){
  ensureAccountData(activeAccount);
  const accData = collections[activeAccount];
  if(!accData[id]) accData[id] = {owned:false, count:0};
  const val = Math.max(0, (accData[id].count||0) + delta);
  accData[id].count = val;
  accData[id].owned = val > 0;
  saveState();
  renderAll();
}

function renderList(){
  const list = document.getElementById('charList');
  list.innerHTML = '';
  ensureAccountData(activeAccount);
  const accData = collections[activeAccount];
  const filtered = getFiltered();

  if(filtered.length === 0){
    list.innerHTML = '<div class="empty-hint">沒有符合條件的角色</div>';
    return;
  }

  filtered.forEach(c=>{
    const entry = accData[c.id] || {owned:false, count:0};
    const card = document.createElement('div');
    card.className = 'char-card' + (entry.owned ? ' owned' : '');
    card.innerHTML = `
      <div class="char-info">
        <div class="char-name" data-id="${c.id}">${c.name}</div>
        <div class="char-meta">
          <span class="badge b-${c.attribute}">${c.attribute||''}</span>
          <span class="stars">${'★'.repeat(c.rarity||0)}</span>
          <span>${c.race||''}</span>
          <span>${c.type||''}</span>
        </div>
        <div class="char-skills" id="skills-${c.id}">
          ${(c.forms && c.forms.length) ? c.forms.map(f=>`
            <div style="margin-bottom:8px;">
              <div style="color:var(--text); font-weight:bold; margin-bottom:2px;">【${f.formName}】</div>
              ${f.active ? `<div><b>主動技:</b> ${f.active}</div>` : ''}
              ${f.passive ? `<div><b>被動:</b> ${f.passive}</div>` : ''}
              ${f.friend ? `<div><b>友情技:</b> ${f.friend}</div>` : ''}
            </div>
          `).join('') : '<div>尚未填寫技能資料</div>'}
        </div>
      </div>
      <div class="char-controls">
        <div class="count-stepper">
          <button class="dec" data-id="${c.id}">－</button>
          <span class="count-val">${entry.count||0}</span>
          <button class="inc" data-id="${c.id}">＋</button>
        </div>
        <div class="owned-toggle ${entry.owned?'on':''}" data-id="${c.id}">${entry.owned?'✓':''}</div>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('.char-name').forEach(el=>{
    el.onclick = ()=>{
      const skills = document.getElementById('skills-' + el.dataset.id);
      if(skills) skills.classList.toggle('show');
    };
  });
  list.querySelectorAll('.owned-toggle').forEach(el=>{
    el.onclick = ()=> setOwned(el.dataset.id, !el.classList.contains('on'));
  });
  list.querySelectorAll('.inc').forEach(el=>{
    el.onclick = ()=> changeCount(el.dataset.id, 1);
  });
  list.querySelectorAll('.dec').forEach(el=>{
    el.onclick = ()=> changeCount(el.dataset.id, -1);
  });
}

function renderStats(){
  const area = document.getElementById('statsArea');
  ensureAccountData(activeAccount);
  const accData = collections[activeAccount];
  const total = characters.length;
  const ownedList = characters.filter(c=> accData[c.id] && accData[c.id].owned);
  const ownedCount = ownedList.length;
  const dupCount = ownedList.filter(c=> accData[c.id].count > 1).length;
  const collectRate = total ? ((ownedCount/total)*100).toFixed(1) : '0.0';
  const dupRate = ownedCount ? ((dupCount/ownedCount)*100).toFixed(1) : '0.0';

  area.innerHTML = `
    <div class="stat-card"><div class="num">${ownedCount} / ${total}</div><div class="label">已收集角色數</div></div>
    <div class="stat-card"><div class="num">${collectRate}%</div><div class="label">收集率</div></div>
    <div class="stat-card"><div class="num">${dupCount}</div><div class="label">重複角色數</div></div>
    <div class="stat-card"><div class="num">${dupRate}%</div><div class="label">重複率</div></div>
  `;
}

function renderAll(){
  renderTabs();
  renderList();
  renderStats();
}

function exportData(){
  const blob = new Blob([JSON.stringify({accounts, collections}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'collections.json';
  a.click();
  hasUnsavedChanges = false;
  updateUnsavedBadge();
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(data.accounts) accounts = data.accounts;
      if(data.collections) collections = data.collections;
      hasUnsavedChanges = false;
      updateUnsavedBadge();
      renderAll();
      alert('匯入完成');
    }catch(err){
      alert('匯入失敗,檔案格式錯誤');
    }
  };
  reader.readAsText(file);
}

['searchBox','attrFilter','rarityFilter','ownedFilter'].forEach(id=>{
  document.getElementById(id).addEventListener('input', renderList);
  document.getElementById(id).addEventListener('change', renderList);
});

// 新增角色表單（支援多型態技能）
const addCharModal = document.getElementById('addCharModal');
const formsContainer = document.getElementById('formsContainer');
let formRowCount = 0;

function addFormRow(prefill){
  formRowCount++;
  const idx = formRowCount;
  const row = document.createElement('div');
  row.className = 'form-row';
  row.dataset.idx = idx;
  row.style.cssText = 'background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:6px;';
  row.innerHTML = `
    <div style="display:flex; gap:6px; align-items:center;">
      <input type="text" class="form-name" placeholder="型態名稱(例:進化前/獸神化/獸神化改)" style="flex:1; padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:13px;">
      <span class="remove-form" style="cursor:pointer; color:var(--bad); font-size:18px; padding:0 4px;">✕</span>
    </div>
    <textarea class="form-active" placeholder="主動技" rows="2" style="padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:13px; resize:vertical; font-family:inherit;"></textarea>
    <textarea class="form-passive" placeholder="被動技能(選填)" rows="2" style="padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:13px; resize:vertical; font-family:inherit;"></textarea>
    <textarea class="form-friend" placeholder="友情技能" rows="2" style="padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:13px; resize:vertical; font-family:inherit;"></textarea>
  `;
  if(prefill){
    row.querySelector('.form-name').value = prefill.formName||'';
    row.querySelector('.form-active').value = prefill.active||'';
    row.querySelector('.form-passive').value = prefill.passive||'';
    row.querySelector('.form-friend').value = prefill.friend||'';
  }
  row.querySelector('.remove-form').onclick = ()=> row.remove();
  formsContainer.appendChild(row);
}

document.getElementById('addFormBtn').onclick = ()=> addFormRow();

document.getElementById('addCharBtn').onclick = ()=>{
  document.getElementById('newCharName').value = '';
  document.getElementById('newCharRace').value = '';
  formsContainer.innerHTML = '';
  addFormRow({formName:'進化前'});
  addCharModal.style.display = 'flex';
};
document.getElementById('cancelAddChar').onclick = ()=>{
  addCharModal.style.display = 'none';
};
document.getElementById('confirmAddChar').onclick = ()=>{
  const name = document.getElementById('newCharName').value.trim();
  if(!name){ alert('請輸入角色名稱'); return; }
  const attribute = document.getElementById('newCharAttr').value;
  const rarity = parseInt(document.getElementById('newCharRarity').value);
  const race = document.getElementById('newCharRace').value.trim();
  const type = document.getElementById('newCharType').value;

  const forms = [];
  formsContainer.querySelectorAll('.form-row').forEach(row=>{
    const formName = row.querySelector('.form-name').value.trim();
    const active = row.querySelector('.form-active').value.trim();
    const passive = row.querySelector('.form-passive').value.trim();
    const friend = row.querySelector('.form-friend').value.trim();
    if(formName || active || passive || friend){
      forms.push({ formName: formName || '型態', active, passive, friend });
    }
  });

  const maxId = characters.reduce((m,c)=> Math.max(m, c.id||0), 0);
  characters.push({ id: maxId+1, name, attribute, rarity, race, type, forms });
  charactersChanged = true;
  addCharModal.style.display = 'none';
  saveState();
  renderAll();
};

let charactersChanged = false;

function exportCharacters(){
  const blob = new Blob([JSON.stringify(characters, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'characters.json';
  a.click();
  charactersChanged = false;
}

fetch('characters.json')
  .then(r=>r.json())
  .then(data=>{
    characters = data;
    return fetch('collections.json').then(r=> r.ok ? r.json() : null).catch(()=>null);
  })
  .then(saved=>{
    if(saved){
      if(saved.accounts) accounts = saved.accounts;
      if(saved.collections) collections = saved.collections;
      activeAccount = accounts[0].id;
    }
    renderAll();
  })
  .catch(()=>{
    document.querySelector('.empty-hint').textContent = '⚠ 無法讀取 characters.json(請部署到 GitHub Pages 開啟，不能直接雙擊本機檔案)';
  });
</script>
