<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>怪物彈珠 收藏管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="title-row">
    <span class="app-title">怪物彈珠 角色收藏管理</span>
    <span class="unsaved-badge" id="unsavedBadge" style="display:none">未匯出</span>
  </div>
  <div class="accounts" id="accountTabs">
    <div class="acc-tab active">帳號1 <span class="acc-edit">✎</span></div>
    <div class="acc-tab">帳號2 <span class="acc-edit">✎</span></div>
    <div class="acc-tab">帳號3 <span class="acc-edit">✎</span></div>
    <div class="acc-tab">帳號4 <span class="acc-edit">✎</span></div>
  </div>
</header>

<!-- ── Main ── -->
<main>

  <!-- 搜尋 -->
  <div class="searchbar">
    <input class="search-input" type="text" placeholder="🔍 搜尋角色名稱...">
    <button class="filter-btn" onclick="openFilter()">▼ 篩選</button>
  </div>

  <!-- 屬性選擇 -->
  <div class="attr-row">
    <div class="attr-circle all active" data-attr="" onclick="setAttr(this)">全</div>
    <div class="attr-circle fire active" data-attr="火" onclick="setAttr(this)"></div>
    <div class="attr-circle water" data-attr="水" onclick="setAttr(this)"></div>
    <div class="attr-circle wood" data-attr="木" onclick="setAttr(this)"></div>
    <div class="attr-circle light" data-attr="光" onclick="setAttr(this)"></div>
    <div class="attr-circle dark" data-attr="暗" onclick="setAttr(this)"></div>
  </div>

  <!-- 統計 -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-num">24<span class="stat-total">/120</span></div>
      <div class="stat-lbl">已收集角色數</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">20.0<span class="stat-total">%</span></div>
      <div class="stat-lbl">收集率</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">3</div>
      <div class="stat-lbl">重複角色數</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">12.5<span class="stat-total">%</span></div>
      <div class="stat-lbl">重複率</div>
    </div>
  </div>

  <!-- 角色格狀列表 -->
  <div class="char-grid" id="charGrid"></div>

</main>

<!-- ── 底部導覽列 ── -->
<nav class="bottom-nav">
  <div class="nav-item active" onclick="setNav(this)">
    <span class="nav-icon">🏠</span>
    <span class="nav-lbl">首頁</span>
  </div>
  <div class="nav-item" onclick="openFilter()">
    <span class="nav-icon">🔍</span>
    <span class="nav-lbl">篩選</span>
  </div>
  <div class="nav-add" onclick="alert('設計稿：點此開啟新增角色表單')">
    <span class="nav-icon">＋</span>
    <span class="nav-lbl">新增</span>
  </div>
  <div class="nav-item" onclick="alert('設計稿：匯出收藏')">
    <span class="nav-icon">⬇</span>
    <span class="nav-lbl">匯出</span>
  </div>
  <div class="nav-item" onclick="alert('設計稿：匯入收藏')">
    <span class="nav-icon">⬆</span>
    <span class="nav-lbl">匯入</span>
  </div>
</nav>

<!-- ── 篩選抽屜（從底部滑上） ── -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeFilter()"></div>
<div class="filter-drawer" id="filterDrawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title">篩選條件</div>

  <div class="drawer-section">
    <div class="drawer-lbl">技能</div>
    <div class="skill-grid">
      <div class="skill-btn" onclick="this.classList.toggle('active')">反重力護罩</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">反傷害壁</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">反傳送</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">掃雷者/飛行</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">掃雷者</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">飛行</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">反板塊</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">反風</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">反魔法陣</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">反減速壁</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">反移轉壁</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">反減速板</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">反多層</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">殺手</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">耐性</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">破壞者</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">SS回合</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">回復</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">護罩</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">阻停雷射</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">異常回復</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">其他</div>
    </div>
  </div>

  <div class="drawer-section">
    <div class="drawer-lbl">超反技能</div>
    <div class="skill-grid">
      <div class="skill-btn" onclick="this.classList.toggle('active')">超反重力護罩</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">超反傷害壁</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">超反傳送</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">超掃雷者</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">超反風</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">超反減速壁</div>
      <div class="skill-btn" onclick="this.classList.toggle('active')">超反移轉壁</div>
    </div>
  </div>

  <div class="drawer-section">
    <div class="drawer-lbl">擊種</div>
    <div class="skill-grid-2">
      <div class="skill-btn" onclick="toggleSingle(this,'strike')">反射型</div>
      <div class="skill-btn" onclick="toggleSingle(this,'strike')">貫通型</div>
    </div>
  </div>

  <div class="drawer-section">
    <div class="drawer-lbl">戰型</div>
    <div class="skill-grid-4">
      <div class="skill-btn" onclick="toggleSingle(this,'battle')">平衡</div>
      <div class="skill-btn" onclick="toggleSingle(this,'battle')">力量</div>
      <div class="skill-btn" onclick="toggleSingle(this,'battle')">速度</div>
      <div class="skill-btn" onclick="toggleSingle(this,'battle')">砲擊</div>
    </div>
  </div>

  <div class="drawer-section">
    <div class="drawer-row-2">
      <div>
        <div class="drawer-lbl">稀有度</div>
        <select class="drawer-select">
          <option value="">全稀有度</option>
          <option>★6</option><option>★5</option><option>★4</option><option>★3</option>
        </select>
      </div>
      <div>
        <div class="drawer-lbl">進化狀態</div>
        <select class="drawer-select">
          <option value="">全部</option>
          <option>進化前</option><option>獸神化</option><option>獸神化·改</option><option>真獸神化</option>
        </select>
      </div>
    </div>
  </div>

  <div class="drawer-section">
    <div class="drawer-row-2">
      <div>
        <div class="drawer-lbl">英雄果實</div>
        <select class="drawer-select">
          <option value="">全部</option>
          <option>有英雄果實</option><option>無英雄果實</option>
        </select>
      </div>
      <div>
        <div class="drawer-lbl">擁有狀態</div>
        <select class="drawer-select">
          <option value="">全部</option>
          <option>已擁有</option><option>未擁有</option>
        </select>
      </div>
    </div>
  </div>

  <div class="drawer-actions">
    <button class="drawer-reset" onclick="closeFilter()">重置</button>
    <button class="drawer-confirm" onclick="closeFilter()">決定</button>
  </div>
</div>

<script>
// ── 假資料 ──────────────────────────────────────────────────────
const SAMPLE = [
  { name:'獸神化・雷神王', attr:'火', rarity:6, owned:true,  count:1 },
  { name:'超絕・水精靈',   attr:'水', rarity:6, owned:true,  count:2 },
  { name:'木之守護神',     attr:'木', rarity:5, owned:false, count:0 },
  { name:'光明天使・莉亞', attr:'光', rarity:6, owned:true,  count:1 },
  { name:'暗黑魔王・路克', attr:'暗', rarity:6, owned:false, count:0 },
  { name:'炎帝・火龍王',   attr:'火', rarity:6, owned:false, count:0 },
  { name:'深海女神・波',   attr:'水', rarity:5, owned:true,  count:1 },
  { name:'森林仙子・葉',   attr:'木', rarity:6, owned:false, count:0 },
];

const ATTR_EMOJI = { 火:'🔥', 水:'💧', 木:'🌿', 光:'⭐', 暗:'🌑' };

function renderGrid(data) {
  const grid = document.getElementById('charGrid');
  grid.innerHTML = '';
  data.forEach(c => {
    const el = document.createElement('div');
    el.className = 'char-card' + (c.owned ? ' owned' : '');
    el.innerHTML = `
      <div class="card-img bg-${c.attr}">
        <span class="card-placeholder-icon">${ATTR_EMOJI[c.attr]||'？'}</span>
        <div class="card-attr-dot attr-dot-${c.attr}"></div>
        ${c.owned ? '<div class="card-check">✓</div>' : ''}
        <div class="card-overlay-gradient"></div>
      </div>
      <div class="card-info">
        <div class="card-name">${c.name}</div>
        <div class="card-foot">
          <span class="card-stars">${'★'.repeat(c.rarity)}</span>
          <span class="card-cnt ${c.owned ? 'has' : ''}">${c.count > 0 ? '持有 x'+c.count : '未持有'}</span>
        </div>
      </div>
    `;
    el.onclick = () => {
      const isOwned = el.classList.toggle('owned');
    };
    grid.appendChild(el);
  });
}

function setAttr(btn) {
  document.querySelectorAll('.attr-row .attr-circle').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const attr = btn.dataset.attr;
  renderGrid(attr ? SAMPLE.filter(c => c.attr === attr) : SAMPLE);
}

function setNav(el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
}

document.querySelectorAll('.acc-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.acc-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  };
});

function openFilter() {
  document.getElementById('filterDrawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
}
function closeFilter() {
  document.getElementById('filterDrawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}
function toggleSingle(btn, group) {
  const was = btn.classList.contains('active');
  document.querySelectorAll(`[onclick*="${group}"]`).forEach(b => b.classList.remove('active'));
  if (!was) btn.classList.add('active');
}

renderGrid(SAMPLE);
</script>
</body>
</html>
